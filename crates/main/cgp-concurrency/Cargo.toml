[package]
name = "cgp-concurrency"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
description = "Runtime-neutral concurrency components for Context-Generic Programming."
readme = "README.md"

[[example]]
name = "fork_handlers"
required-features = ["smol"]

[features]
default = []
smol = ["dep:cgp-concurrency-smol"]
tokio = ["dep:cgp-concurrency-tokio"]

[dependencies]
cgp-core = { workspace = true }
cgp-handler = { workspace = true }
cgp-concurrency-runtime = { workspace = true }
cgp-concurrency-smol = { workspace = true, optional = true }
cgp-concurrency-tokio = { workspace = true, optional = true }
futures-util = { version = "0.3", default-features = false }
pin-project-lite = "0.2"

[dev-dependencies]
futures-lite = "2.6"

[lints]
workspace = true
