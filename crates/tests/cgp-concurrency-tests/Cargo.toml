[package]
name = "cgp-concurrency-tests"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false

[[bench]]
name = "spawn_join"
harness = false
required-features = ["smol", "tokio"]

[[bench]]
name = "task_batches"
harness = false
required-features = ["smol", "tokio"]

[features]
default = []
smol = ["cgp-concurrency/smol", "dep:smol"]
tokio = ["cgp-concurrency/tokio", "dep:tokio"]
heap-profile = ["dep:mod-alloc"]

[dependencies]
mod-alloc = { version = "1.1", optional = true }
smol = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }

[dev-dependencies]
async-channel = "2.5"
cgp-concurrency = { workspace = true }
cgp-core = { workspace = true }
cgp-handler = { workspace = true }
cpu-time = "1"
criterion = { version = "0.7", default-features = false }
futures-lite = "2.6"

[lints]
workspace = true
