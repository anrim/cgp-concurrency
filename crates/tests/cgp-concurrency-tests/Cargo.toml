[package]
name = "cgp-concurrency-tests"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false

[features]
default = []
smol = ["cgp-concurrency/smol", "dep:smol"]
tokio = ["cgp-concurrency/tokio", "dep:tokio"]

[dependencies]
smol = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }

[dev-dependencies]
async-channel = "2.5"
cgp-concurrency = { workspace = true }
cgp-core = { workspace = true }
cgp-handler = { workspace = true }
futures-lite = "2.6"

[lints]
workspace = true
